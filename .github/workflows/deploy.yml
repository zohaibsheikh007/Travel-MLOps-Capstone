name: Build and Deploy Flight Price API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "Flight Prediction/requirements.txt"

      - name: Train model
        run: python "Flight Prediction/train_model.py"

      - name: Run unit tests
        run: |
          pip install pytest
          cd "Flight Prediction"
          python -m pytest tests/ -v

      - name: Run API health check
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'Flight Prediction')
          from Flight_Price import app
          client = app.test_client()
          resp = client.get('/health')
          assert resp.status_code == 200
          print('Health check passed')
          "

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Check for Docker Hub credentials
        id: dockercheck
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Docker Hub credentials not set - skipping image build/push."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.dockercheck.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Train model for Docker image
        if: steps.dockercheck.outputs.configured == 'true'
        run: pip install -r "Flight Prediction/requirements.txt" && python "Flight Prediction/train_model.py"

      - name: Log in to Docker Hub
        if: steps.dockercheck.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.dockercheck.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: "./Flight Prediction"
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flight-price-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/flight-price-api:latest

      - name: Update Kubernetes manifest
        if: steps.dockercheck.outputs.configured == 'true'
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/flight-price-api:${{ github.sha }}|" "Flight Prediction/deployment.yaml"

      - name: Commit updated manifest
        if: steps.dockercheck.outputs.configured == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Only the manifest matters; ignore artifacts left by the train step
          # (random_forest.pkl, scaling.pkl, feature_columns.json, etc.) so they
          # don't block a rebase against a moved main branch.
          git add "Flight Prediction/deployment.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git stash push --include-untracked --keep-index --message "ci-artifacts" || true
          git commit -m "ci: update image tag to ${{ github.sha }}"

          # Retry-with-rebase loop: if main moved while we were building,
          # rebase our single commit on top of the latest tip and try again.
          # Use `-X theirs` so that when two concurrent runs touch the same
          # `image:` line, we keep OUR version (which corresponds to the newer
          # commit SHA the workflow was triggered for).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed manifest update on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing on origin/main..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "Rebase failed - aborting and exiting."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Failed to push manifest update after 5 attempts." >&2
          exit 1
