name: Build and Deploy Flight Price API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "Flight Prediction/requirements.txt"

      - name: Train model
        run: python "Flight Prediction/train_model.py"

      - name: Run unit tests
        run: |
          pip install pytest
          cd "Flight Prediction"
          python -m pytest tests/ -v

      - name: Run API health check
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'Flight Prediction')
          from Flight_Price import app
          client = app.test_client()
          resp = client.get('/health')
          assert resp.status_code == 200
          print('Health check passed')
          "

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Check for Docker Hub credentials
        id: dockercheck
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Docker Hub credentials not set - skipping image build/push."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.dockercheck.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Train model for Docker image
        if: steps.dockercheck.outputs.configured == 'true'
        run: pip install -r "Flight Prediction/requirements.txt" && python "Flight Prediction/train_model.py"

      - name: Log in to Docker Hub
        if: steps.dockercheck.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.dockercheck.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: "./Flight Prediction"
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flight-price-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/flight-price-api:latest

      - name: Image summary
        if: steps.dockercheck.outputs.configured == 'true'
        run: |
          echo "## Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ secrets.DOCKER_USERNAME }}/flight-price-api:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ secrets.DOCKER_USERNAME }}/flight-price-api:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Kubernetes manifest tracks the \`:latest\` tag, so a \`kubectl rollout restart deployment/flight-price-deployment\` is enough to pick up this build." >> "$GITHUB_STEP_SUMMARY"
